name: Mise à jour World Monitor

# Les données ne sont plus commitées : l'archive vit dans les Releases GitHub
# (voir pipeline/archive.py) et le site est publié directement sur Pages.
on:
  schedule:
    - cron: '7,37 * * * *'   # léger : deux fois par heure, hors des minutes pleines (moins de retards)
    - cron: '17 4 * * 1'     # complet : lundi 04:17 UTC (réapplique les dictionnaires aux jours récents)
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'exécution"
        type: choice
        options: [leger, complet]
        default: leger

permissions:
  contents: write   # écrire dans les Releases
  pages: write      # publier le site
  id-token: write   # requis par actions/deploy-pages

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    env:
      WM_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache des modèles de traduction
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.local/cache/argos-translate
          key: argos-models-v1

      - name: Dépendances (traduction non bloquante)
        run: |
          pip install openpyxl pyarrow
          { pip install torch --index-url https://download.pytorch.org/whl/cpu \
            && pip install argostranslate \
            && python -c "import argostranslate.translate; print('Argos OK')"; } \
            || echo "⚠ Argos indisponible pour ce run : la traduction sera sautée, tout le reste continue"

      - name: Récupérer l'état du collecteur (vus.txt)
        run: python pipeline/archive.py preparer

      - name: Collecte des flux RSS
        run: python pipeline/collecteur.py

      - name: Classification + génération du site
        run: |
          if [ "${{ github.event.schedule }}" = "17 4 * * 1" ] || [ "${{ github.event.inputs.mode }}" = "complet" ]; then
            echo "== Mode COMPLET =="
            python pipeline/assembler.py --full
          else
            echo "== Mode léger =="
            python pipeline/assembler.py
          fi

      # Les fichiers d'archive d'abord, vus.txt en dernier : si l'envoi coupe en
      # route, le run suivant recollecte ce qui manque au lieu de le perdre.
      - name: Envoyer l'archive dans les Releases
        run: python pipeline/archive.py publier

      - name: Préparer le site
        run: |
          mkdir _site
          cp -r docs/. _site/
          rm -f _site/data.js _site/world_monitor.csv _site/world_monitor.db _site/world_monitor.xlsx
          touch _site/.nojekyll
          du -sh _site

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publier sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4
